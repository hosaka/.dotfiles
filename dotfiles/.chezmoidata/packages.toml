[packages.apt]
remove = []

[packages.apt.common]
packages = ["curl", "bat", "fd-find", "git", "ripgrep", "zoxide", "wget"]

[packages.apk]
remove = []

[packages.apk.common]
packages = [
  "atuin@edge",
  "atuin-sync@edge",
  "bat",
  "chezmoi@edge",
  "curl",
  "delta",
  "difftastic",
  "dua@edge",
  "duf@edge",
  "eza",
  "fd",
  "git",
  "just@edge",
  "lazygit@edge",
  # "prek@edge",       # when available
  "procs@edge",
  "ripgrep",
  "starship@edge",
  "zoxide",
  "wget",
]

[packages.xbps]
# when removing a package from a list, place it here and it will
# be removed next time you run chezmoi apply
remove = ["bob", "dust", "cage", "ReGreet", "pywalfox"]

# Each group below is named after a data flag from .chezmoi.toml.tmpl and is
# only used when that flag is true, `common` is always used. `services` are
# runit services that the group needs enabled, they are not enabled by chezmoi
# but are used by vast-mklive when building an ISO.

[packages.xbps.common]
packages = [
  "7zip",
  "atuin",
  "bat",
  "btop",
  "chezmoi",
  "chrony",
  "curl",
  "delta",
  "difftastic",
  "dua-cli",
  "duf",
  "eza",
  "fastfetch",
  "fd",
  "fish-shell",
  "git",
  "htop",
  "jq",
  "just",
  "lazygit",
  "liberated-packages", # similar to removed-packages but for my own repo
  "neovim",
  "opendoas",           # sudo is ignored in /etc/xbps.d/ignore.conf
  "openssh-sk-helper",  # FIDO2 ssh keys
  "ouch",
  "procs",
  "psmisc",             # killall, pstree
  "ripgrep",
  "snooze",
  "socat",              # SSH ProxyCommand helper for FRP servers
  "socklog-void",
  "starship",           # only used on hosts that do not used fish-shell
  "tlrc",
  "tree",
  "vsv",
  "wget",
  "xtools",
  "yazi",
  "yq",
  "zellij",
  "zoxide",
]
services = [
  "chronyd",
  "dhcpcd",
  "nanoklogd",
  "snooze-daily",
  "snooze-hourly",
  "snooze-monthly",
  "snooze-weekly",  # runs /etc/cron.weekly/fstrim
  "socklog-unix",
]

[packages.xbps.desktop]
packages = [
  "adw-gtk3",
  "alacritty",
  "bibata-cursor-themes",
  "bluez",
  "brightnessctl",
  "candy-icons",
  "cliphist",
  "dbus",
  "dejavu-fonts-ttf",
  "elogind",
  "evtest",                             # noctalia plugins that read keyboard input
  "firefox",
  "flatpak",
  "fuzzel",
  "gcr4",                               # gcr-ssh-agent, niri sets SSH_AUTH_SOCK
  "gnome-keyring",
  "gpu-screen-recorder",
  "greetd",
  "halloy",
  "ibus",
  "ibus-gtk4",
  "ibus-mozc",
  "imv",
  "kanshi",
  "libnotify",
  "libspa-bluetooth",                   # bluetooth audio devices
  "maple-fonts-nerdfonts-cn",
  "mesa-dri",
  "miru",
  "mozc",
  "mpv",
  "neovide",
  "nerd-fonts-symbols-ttf",
  "niri",
  "noctalia",
  "noctalia-greeter",
  "noto-fonts-cjk",
  "noto-fonts-emoji",
  "nwg-look",
  "pinentry-gnome",                     # pinentry for rbw
  "pipewire",
  "polkit",                             # noctalia, flatpak, polkitd is started by D-Bus
  "qt6-wayland",                        # without it Qt6 apps run under XWayland
  "qt6ct",
  "ripdrag",
  "seahorse",
  "turnstile",                          # only used for user runit services
  "wdisplays",
  "wlsunset",
  "xdg-desktop-portal",
  "xdg-desktop-portal-gnome",
  "xdg-desktop-portal-gtk",
  "xdg-desktop-portal-termfilechooser", # use `zenity --file-selection` for testing
  "xdg-user-dirs",
  "xdg-user-dirs-gtk",
  "xdg-utils",
  "xwayland-satellite",                 # xwayland for niri
]
services = ["bluetoothd", "dbus", "greetd", "turnstiled"]

[packages.xbps.nvidia]
packages = [
  "nvidia", # nonfree, modeset is enabled in system/etc/modprobe.d
]

[packages.xbps.personal]
packages = [
  "aerc",
  "age",
  "age-plugin-yubikey",
  "openpgp-card-tool-git",
  "openpgp-card-tools",
  "rbw",
  "yubikey-manager",
  # "helix",
  # "zk",
]
services = [
  "pcscd", # smartcard access for oct and ykman
]

[packages.xbps.development]
packages = [
  "StyLua",
  "bash-language-server",
  "forgejo-cli",
  "github-cli",
  "hexyl",
  "hyperfine",
  "just-lsp",
  "lua-language-server",
  "mise", # installed before run_once_10-install-mise.sh, which then skips the curl install
  "prek",
  "rsync",
  "shellcheck",
  "shfmt",
  "taplo",
  "watchexec",
  "xh",
  "yaml-language-server",
  # "rustup",
  # "tree-sitter",           # when it's 0.26
]
