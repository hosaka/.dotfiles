[zoom]
factor = 1.3
increment = 0.25
max_factor = 10.0
smooth = true
upscale = "linear"

[spotlight]
radius = 250
dim = 0.65
softness = 20
animation_speed = 14.0
radius_step = 20.0

[general]
show_cursor = true
status_badge = false

[annotate]
default = "rect"
thickness = 2.0
color = "ff3333"
text_color = "ffd933"
text_size = 1.0

[loupe]
shape = "rect"

[export]
format = "png"

[filter]
default = "none"

[keybinds]
quit = "Q"
