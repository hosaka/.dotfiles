## All options and their defaults: `atuin default-config`
## Docs: https://docs.atuin.sh/configuration/config/

update_check = false
sync_address = "https://atuin.hosaka.cc"

## fzf-style search over an in-memory index kept by the daemon (see [daemon])
search_mode = "daemon-fuzzy"

style = "compact"
inline_height = 20
show_help = false
enter_accept = true
secrets_filter = true

## Commands never written to history. Regexes are unanchored, so anchor with ^ and $.
## Remove existing matches with `atuin history prune` (preview with `--dry-run`).
history_filter = [
  # listing, with flags but no path
  '^(l|la|ll|lla|ls|lt)( +-[a-zA-Z]+)*$',
  # bare navigation, yazi alias, zoxide
  '^(cd|cd \.|cd \.\.|cd -|\.\.|\.\.\.|\.\.\.\.|y)$',
  '^zi?( |$)',
  # shell housekeeping
  '^(clear|exit|fg)$',
  # apps launched without arguments
  '^(nvim|vim|claude|zellij|htop|btop|yazi|python3?|fish|bash)$',
  # git shortcuts, and status/sync without arguments
  '^(gg|gl|gs|gst|glg|lazygit|lazydocker|git +(status|s|l|log|diff|pull|push|fetch|remotes))$',
  # chezmoi routine
  '^(dot|dotgg|(dot|chezmoi) +(gg|l|cd|diff|status|pull|apply|update))$',
  # docker status and cleanup
  '^(dimg|dpsa|diprune|dpr|docker +(ps|ps -a|images|container prune|image prune|system prune))$',
  # package management that names no package
  '^((sudo|doas) +)?(xi|xrm|xls|xrs|xq|xbps-install|xbps-remove)( +-[a-zA-Z]+)+$',
  '^((sudo|doas) +)?apt(-get)? +(update|upgrade|full-upgrade|dist-upgrade|autoremove)( +-[a-zA-Z]+)*$',
  '^((sudo|doas) +)?apk +(update|upgrade)( +-[a-zA-Z]+)*$',
  '^(flatpak +update( +-y)?|rustup +update)$',
  '^mise +(ls|env|install|prune|outdated|up|upgrade)( +-[a-zA-Z-]+)*$',
]

## Commands run from these directories are never written to history.
cwd_filter = ['^/tmp(/|$)']

[stats]
common_subcommands = [
  "apt",
  "cargo",
  "docker",
  "git",
  "go",
  "ip",
  "npm",
  "pnpm",
  "podman",
  "systemctl",
]
common_prefix = ["sudo", "doas"]
ignored_commands = ["l", "la", "ll", "lla", "ls", "lt", "gg", "gl", "gs"]

[sync]
records = true

[daemon]
enabled = true
## start and stop the daemon automatically (no systemd/runit service needed)
autostart = true

[ai]
## `?` on an empty prompt generates a command
enabled = true
