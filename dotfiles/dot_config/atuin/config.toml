## All options and their defaults: `atuin default-config`
## Docs: https://docs.atuin.sh/configuration/config/

update_check = false
sync_address = "https://atuin.hosaka.cc"

## fzf-style search over an in-memory index kept by the daemon (see [daemon])
search_mode = "daemon-fuzzy"

style = "compact"
inline_height = 20
show_help = false
enter_accept = true
secrets_filter = true

## Commands never written to history. Regexes are unanchored, so anchor with ^ and $.
## Remove existing matches with `atuin history prune` (preview with `--dry-run`).
history_filter = [
  # listing, with flags but no path
  '^(l|la|ll|lla|ls|lt)( +-[a-zA-Z]+)*$',
  # bare navigation
  '^(cd|cd \.\.|cd -|\.\.|z|y)$',
  # shell housekeeping
  '^(clear|exit|fg)$',
  # bare git shortcuts and lazygit
  '^(gg|gl|gs|lazygit)$',
]

## Commands run from these directories are never written to history.
cwd_filter = ['^/tmp(/|$)']

[stats]
common_subcommands = [
  "apt",
  "cargo",
  "docker",
  "git",
  "go",
  "ip",
  "npm",
  "pnpm",
  "podman",
  "systemctl",
]
common_prefix = ["sudo", "doas"]
ignored_commands = [
  "l",
  "la",
  "ll",
  "lla",
  "ls",
  "lt",
  "gg",
  "gl",
  "gs",
  "lazygit",
]

[sync]
records = true

[daemon]
enabled = true
## start and stop the daemon automatically (no systemd/runit service needed)
autostart = true

[ai]
## `?` on an empty prompt generates a command
enabled = true
